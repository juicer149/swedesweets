{% extends "base.html" %}

{% block title %}
  Become a partner
{% endblock %}

{% block content %}

<section class="page-section">
  <article class="container">

    <h1 class="page-title">Become a partner</h1>

    <p class="page-subtitle">
      Tell us about your store and we’ll get back to you shortly.
    </p>

    <form method="post">
      {% csrf_token %}

      <div class="stack">

        <!-- CONTACT PERSON -->
        <div>
          <label for="name">Contact person (full name)</label>
          <input
            id="name"
            type="text"
            name="name"
            placeholder="e.g. Marco Dupont"
          >
        </div>

        <!-- STORE NAME -->
        <div>
          <label for="store_name">Store name</label>
          <input
            id="store_name"
            type="text"
            name="store_name"
            placeholder="e.g. Chamonix Candy Shop"
          >
        </div>

        <!-- EMAIL -->
        <div>
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="e.g. hello@store.com"
            autocomplete="email"
            required
          >
        </div>

        <!-- PHONE -->
        <div>
          <label for="phone">Phone number</label>
          <input
            id="phone"
            type="text"
            name="phone"
            placeholder="e.g. +33 6 12 34 56 78"
          >
        </div>

        <!-- ADDRESS -->
        <div>
          <label for="address">Store address</label>
          <textarea
            id="address"
            name="address"
            placeholder="e.g. 12 Rue de la Gare, 74400 Chamonix, France"
          ></textarea>
        </div>

        <!-- MESSAGE -->
        <div>
          <label for="message">Anything we should know?</label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell us about your store, customers, or interest"
          ></textarea>
        </div>

      </div>

      <div class="stack">
        <button type="submit">
          Send request
        </button>
      </div>

    </form>

  </article>
</section>

{% endblock %}
