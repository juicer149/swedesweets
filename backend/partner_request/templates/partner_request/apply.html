{% extends "base.html" %}

{% block title %}
  Partner application
{% endblock %}

{% block content %}

<section class="page-section">
  <article class="container left">

    <h1 class="page-title">Become a partner</h1>

    <p class="page-subtitle">
      For stores and retailers interested in carrying SwedeSweets products.
    </p>

    <!-- Alternative path -->
    <div class="stack">
      <p>
        Just have a question?
        <a href="{% url 'pages:contact' %}" class="link">
          Contact us instead
        </a>
      </p>
    </div>

    <form method="post">
      {% csrf_token %}

      <div class="stack">

        <div class="form-field">
          <label for="name">Contact person</label>
          <input
            id="name"
            type="text"
            name="name"
            placeholder="e.g. Marco Dupont"
          >
        </div>

        <div class="form-field">
          <label for="store_name">Store name</label>
          <input
            id="store_name"
            type="text"
            name="store_name"
            placeholder="e.g. Chamonix Candy Shop"
          >
        </div>

        <div class="form-field">
          <label for="email">Email address</label>
          <input
            id="email"
            type="email"
            name="email"
            placeholder="e.g. hello@store.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-field">
          <label for="phone">Phone number</label>
          <input
            id="phone"
            type="text"
            name="phone"
            placeholder="e.g. +33 6 12 34 56 78"
          >
        </div>

        <div class="form-field">
          <label for="address">Store address</label>
          <textarea
            id="address"
            name="address"
            placeholder="e.g. 12 Rue de la Gare, 74400 Chamonix"
          ></textarea>
        </div>

        <div class="form-field">
          <label for="message">Message</label>
          <textarea
            id="message"
            name="message"
            placeholder="Tell us about your store or interest"
          ></textarea>
        </div>

      </div>

      <div class="stack">
        <button type="submit">
          Send request
        </button>
      </div>

    </form>

  </article>
</section>

{% endblock %}
