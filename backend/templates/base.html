<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}SwedeSweets{% endblock %}</title>

  <style>
    /* =========================================================
       GLOBAL RESET / BASE
    ========================================================= */

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    main {
      padding: 1rem;
    }

    /* =========================================================
       LAYOUT SYSTEM (NY)
    ========================================================= */

    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .left {
      text-align: left;
    }

    /* =========================================================
       NAVBAR SYSTEM
    ========================================================= */

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .navbar-inner {
      max-width: 900px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .logo {
      position: absolute;
      left: 16px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .nav-links {
      margin: 0 auto;
      display: flex;
      gap: 20px;
    }

    .nav-link {
      font-size: 0.95rem;
      border-bottom: 1px solid transparent;
    }

    .nav-link:hover {
      border-bottom: 1px solid black;
    }

    .nav-link.active {
      font-weight: 700;
      border-bottom: 1px solid black;
    }

    .login-button {
      position: absolute;
      right: 16px;
      background: black;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* =========================================================
       LINK SYSTEM
    ========================================================= */

    .link {
      border-bottom: 1px solid #ddd;
    }

    .link:hover {
      border-bottom: 1px solid black;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
    }

    /* =========================================================
       FORM SYSTEM
    ========================================================= */

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
      display: block;
      margin-bottom: 4px;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 16px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    ::placeholder {
      color: #999;
    }

    /* =========================================================
       PAGE SYSTEM
    ========================================================= */

    .page-section {
      text-align: center;
      padding: 60px 20px;
    }

    .page-section--narrow {
      padding: 30px 20px;
    }

    .page-section--spaced {
      margin-top: 60px;
    }

    .page-title {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .page-subtitle {
      color: #555;
      font-size: 0.95rem;
    }

    /* =========================================================
       BUTTON SYSTEM
    ========================================================= */

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .button-primary {
      background: black;
      color: white;
    }

    .button-secondary {
      border: 1px solid black;
      color: black;
    }

    .button + .button {
      margin-left: 10px;
    }

    /* =========================================================
       SPACING SYSTEM
    ========================================================= */

    .stack {
      margin-top: 30px;
    }

    .stack > * + * {
      margin-top: 16px;
    }

    /* =========================================================
       CONTACT SYSTEM
    ========================================================= */

    .contact-block {
      margin-top: 24px;
    }

    .contact-block:first-child {
      margin-top: 0;
    }

    .contact-label {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .contact-value {
      color: #333;
      font-size: 0.95rem;
    }

    /* =========================================================
       CATALOG SYSTEM
    ========================================================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 14px;
    }

    .card-link {
      color: inherit;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
      text-align: center;
      transition: transform 0.08s ease;
    }

    .card:hover {
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-radius: 8px;
    }

    .card-name {
      font-size: 0.9rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .card-code {
      font-size: 0.75rem;
      color: #777;
    }

    .no-image {
      height: 90px;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      font-size: 0.8rem;
      color: #777;
    }

    /* =========================================================
       PRODUCT DETAIL
    ========================================================= */

    .product-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .product-meta {
      color: #777;
      font-size: 0.85rem;
    }

    .product-section {
      margin-top: 20px;
    }

    .notice {
      background: #fff3cd;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

  </style>
</head>

<body>

  {% include "includes/navbar.html" %}

  <main>
    <div class="page-wrapper">
      {% block content %}{% endblock %}
    </div>
  </main>

</body>
</html>
