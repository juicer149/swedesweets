<!DOCTYPE html>
<html>
<head>
  <title>{% block title %}SwedeSweets{% endblock %}</title>

  <style>
    /* =========================================================
       GLOBAL RESET / BASE
    ========================================================= */

    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      margin: 0;
      background: #f5f5f5;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    main {
      padding: 1rem;
    }

    /* =========================================================
       LAYOUT SYSTEM
    ========================================================= */

    .page-wrapper {
      max-width: 900px;
      margin: 0 auto;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
    }

    .left {
      text-align: left;
    }

    /* =========================================================
       NAVBAR SYSTEM
    ========================================================= */

    .navbar {
      background: white;
      border-bottom: 1px solid #eee;
    }

    .navbar-inner {
      max-width: 900px;
      margin: auto;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      position: relative;
    }

    .logo {
      position: absolute;
      left: 16px;
      font-weight: 700;
      font-size: 1.1rem;
    }

    .nav-links {
      margin: 0 auto;
      display: flex;
      gap: 20px;
    }

    .nav-link {
      font-size: 0.95rem;
      border-bottom: 1px solid transparent;
    }

    .nav-link:hover {
      border-bottom: 1px solid black;
    }

    .nav-link.active {
      font-weight: 700;
      border-bottom: 1px solid black;
    }

    .login-button {
      position: absolute;
      right: 16px;
      background: black;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
    }

    /* =========================================================
       ALERT SYSTEM
    ========================================================= */

    .alert {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .alert-error {
      background: #ffe5e5;
      color: #a00;
    }

    .alert-success {
      background: #e6ffed;
      color: #0a7a2f;
    }

    /* =========================================================
       LINK SYSTEM
    ========================================================= */

    .link {
      border-bottom: 1px solid #ddd;
    }

    .link:hover {
      border-bottom: 1px solid black;
    }

    .back-link {
      display: inline-block;
      margin-bottom: 16px;
    }

    /* =========================================================
       FORM SYSTEM
    ========================================================= */

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 20px;
    }

    .form-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    label {
      font-size: 0.9rem;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #ddd;
      font-size: 0.95rem;
      font-family: inherit;
      box-sizing: border-box;
    }

    input:focus,
    textarea:focus {
      outline: none;
      border-color: black;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      padding: 12px 16px;
      background: black;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    ::placeholder {
      color: #999;
    }

    /* =========================================================
       PAGE SYSTEM
    ========================================================= */

    .page-section {
      text-align: center;
      padding: 60px 20px;
    }

    .page-section--narrow {
      padding: 30px 20px;
    }

    .page-section--spaced {
      margin-top: 60px;
    }

    .page-title {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    .page-subtitle {
      color: #555;
      font-size: 0.95rem;
    }

    /* =========================================================
       BUTTON SYSTEM
    ========================================================= */

    .button {
      display: inline-block;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }

    .button-primary {
      background: black;
      color: white;
    }

    .button-secondary {
      border: 1px solid black;
      color: black;
    }

    .button + .button {
      margin-left: 10px;
    }

    /* =========================================================
       SPACING SYSTEM
    ========================================================= */

    .stack {
      margin-top: 30px;
    }

    .stack > * + * {
      margin-top: 16px;
    }

    /* =========================================================
       FAQ SYSTEM
    ========================================================= */

    .faq-item {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .faq-item summary {
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      list-style: none;
    }

    .faq-item summary::-webkit-details-marker {
      display: none;
    }

    .faq-item summary::after {
      content: "+";
      float: right;
      font-weight: 400;
    }

    .faq-item[open] summary::after {
      content: "−";
    }

    .faq-answer {
      margin-top: 8px;
      color: #555;
      font-size: 0.95rem;
    }

  </style>
</head>

<body>

  {% include "includes/navbar.html" %}

  <main>
    <div class="page-wrapper">
      {% block content %}{% endblock %}
    </div>
  </main>

  {% include "includes/footer.html" %}

</body>
</html>
