<nav class="navbar">
  <div class="navbar-inner">

    <!-- LOGO -->
    <a href="{% url 'pages:home' %}" class="logo">
      SwedeSweets
    </a>

    <!-- NAV LINKS -->
    <div class="nav-links">

      <a href="{% url 'product_list' %}"
         class="nav-link {% if request.resolver_match.url_name == 'product_list' %}active{% endif %}">
        Products
      </a>

      <a href="{% url 'pages:about' %}"
         class="nav-link {% if request.resolver_match.url_name == 'about' %}active{% endif %}">
        About
      </a>

      <a href="{% url 'pages:contact' %}"
         class="nav-link {% if request.resolver_match.url_name == 'contact' %}active{% endif %}">
        Contact
      </a>

      {% if not request.user.is_authenticated %}
        <a href="{% url 'apply' %}"
           class="nav-link {% if request.resolver_match.url_name == 'apply' %}active{% endif %}">
          Apply
        </a>
      {% endif %}

    </div>

    <!-- RIGHT SIDE -->
    {% if request.user.is_authenticated %}

      <a href="{% url 'portal' %}" class="login-button">
        Portal
      </a>

    {% else %}

      <a href="{% url 'login' %}" class="login-button">
        Login
      </a>

    {% endif %}

  </div>
</nav>
