{% if messages %}
  <div class="messages" aria-live="polite">
    {% for message in messages %}
      {% if 'cart-notice' in message.tags %}
        <p class="cart-notice" data-cart-notice{% if 'cart-flow-notice' in message.tags %} data-cart-flow-notice{% endif %} role="status">{{ message }}</p>
      {% else %}
        <p class="message message--{{ message.tags }}">
          {{ message }}
        </p>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
