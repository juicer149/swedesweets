{% if messages %}
  <div class="messages" aria-live="polite">
    {% for message in messages %}
      {% if 'cart-notice' in message.tags %}
        <p class="cart-notice" data-cart-notice role="status">{{ message }}</p>
      {% else %}
        <p class="message message--{{ message.tags }}">
          {{ message }}
        </p>
      {% endif %}
    {% endfor %}
  </div>
{% endif %}
