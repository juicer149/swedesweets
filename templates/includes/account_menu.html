{% load i18n %}
<details class="account-menu" data-dismiss-on-outside-click>
  <summary class="account-menu__trigger menu-dropdown-trigger" aria-label="{% if account_menu.account %}{{ account_menu.account.label }}{% else %}{% trans 'My account' %}{% endif %}"{% if navbar_account_current %} aria-current="page"{% endif %}>
    {% include "includes/ui/icon.html" with name="user" %}
    <span class="menu-dropdown-trigger__crown" aria-hidden="true"></span>
  </summary>
  <div class="account-menu__panel">
    {% if account_menu.account %}
    <a class="quiet-link account-menu__link" href="{{ account_menu.account.href }}"
      {% if request.resolver_match.view_name == account_menu.account.route_name %}{% if not account_menu.orders or request.GET.tab != 'orders' %}aria-current="page"{% endif %}{% endif %}>{% trans 'Profile' %}</a>
    {% if account_menu.orders %}
      <a class="quiet-link account-menu__link" href="{{ account_menu.orders.href }}"
        {% if request.resolver_match.view_name == account_menu.orders.route_name or request.GET.tab == 'orders' %}aria-current="page"{% endif %}>{{ account_menu.orders.label }}</a>
    {% endif %}
    <form class="account-menu__logout" method="post" action="{% url 'logout' %}" data-dirty-ignore="true">
      {% csrf_token %}
      <button class="quiet-link account-menu__link" type="submit">{% trans 'Log out' %}</button>
    </form>
    {% else %}
      <a class="quiet-link account-menu__link" href="{% url 'login' %}">{% trans 'Login' %}</a>
    {% endif %}
  </div>
</details>
