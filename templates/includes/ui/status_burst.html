{% comment %}
  The status burst (status_burst.js, status-burst.css): something waits
  while a request runs, then a mark says how it went. Rendered once, in
  base.html, as a <template>; the script clones it where it is needed and
  reads two tokens there (tokens.css), so the CSS chooses the look:

    --feedback-burst-style  how it waits:
      ring        eight dots in a ring
      dots        three dots in a row, growing in turn
      wave        the logo's crown, its three dots growing in turn
      scoop       a pick & mix scoop spinning, slowing to a stop when
                  the answer comes, as if someone had spun it
    --feedback-burst-mark   what grows in when it worked, after ring, dots
                            or scoop: crown, cart, check or bag (our paper
                            bag, tilted) (wave is its own mark: the crown
                            glows)

  A problem is a cross. A place has its own look by setting the tokens on
  its element (the end of tokens.css).

  name  what the script asks for (data-status-burst="name")
  tone  extra class for another colour (e.g. "status-burst--ops")
{% endcomment %}
<template data-status-burst="{{ name }}">
  <span class="status-burst{% if tone %} {{ tone }}{% endif %}" data-state="loading">
    {% for i in "01234567" %}<span class="status-burst__dot" style="--i: {{ i }}"></span>{% endfor %}
    <span class="status-burst__beats">{% for i in "012" %}<span class="status-burst__beat" style="--i: {{ i }}"></span>{% endfor %}</span>
    <span class="status-burst__scoop">{% include "includes/ui/scoop.html" %}</span>

      {% include "includes/ui/icon_block.html" with name="crown" only %}
    </span>
