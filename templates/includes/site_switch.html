{% load i18n %}
<fieldset class="site-preferences__group">
  <legend>{% trans 'Site' %}</legend>
  <form class="site-preferences__theme" method="get" action="{{ account_menu.switch.href }}" data-dirty-ignore="true">
    <button class="theme-switch site-switch" type="submit" role="switch" aria-label="{% trans 'Ops' %}"
      aria-checked="{% if account_menu.site_is_ops %}true{% else %}false{% endif %}" title="{{ account_menu.switch.label }}">
      <span class="site-switch__symbol site-switch__public" aria-hidden="true">
        {% include "includes/ui/icon.html" with name="storefront" %}
      </span>
      <span class="site-switch__symbol site-switch__ops" aria-hidden="true">
        {% include "includes/ui/icon.html" with name="wrench" %}
      </span>
      <span class="theme-switch__thumb" aria-hidden="true"></span>
    </button>
    <span class="site-preferences__theme-name" aria-hidden="true">{% if account_menu.site_is_ops %}{% trans 'Ops' %}{% else %}{% trans 'Public site' %}{% endif %}</span>
  </form>
</fieldset>
