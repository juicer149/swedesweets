{% load i18n %}
<nav class="order-progress{% if step == 'placed' %} is-complete{% endif %}" aria-label="{% trans 'Order progress' %}" data-order-progress="{{ step }}" data-flow-reload="{% trans 'Reload page' %}" data-flow-loading="{% trans 'Loading…' %}" data-flow-error="{% trans 'We could not load the next step. Reload the page to check your order.' %}">
  <ol class="order-progress__steps">
    <li class="order-progress__step is-lit"{% if step == 'cart' %} aria-current="step"{% endif %}>
      <span class="order-progress__dot" aria-hidden="true"></span>
      <span class="order-progress__label">{% trans 'Cart' %}</span>
    </li>
    <li class="order-progress__step{% if step != 'cart' %} is-lit{% endif %}"{% if step == 'review' %} aria-current="step"{% endif %}>
      <span class="order-progress__dot" aria-hidden="true"></span>
      <span class="order-progress__label">{% trans 'Review order' %}</span>
    </li>
    <li class="order-progress__step{% if step == 'placed' %} is-lit{% endif %}"{% if step == 'placed' %} aria-current="step"{% endif %}>
      <span class="order-progress__dot" aria-hidden="true"></span>
      <span class="order-progress__label">{% trans 'Order placed' %}</span>
    </li>
  </ol>
</nav>
