{% comment %}A mail's yellow button, centred. Expects: href, label.{% endcomment %}
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="margin-top:28px;">
  <tr>
    <td align="center">
      <table role="presentation" cellpadding="0" cellspacing="0">
        <tr>
          <td style="background:#f6b51e; border-radius:999px;">
            <a href="{{ href }}" style="display:inline-block; padding:12px 24px; color:#191715; font-weight:800; text-decoration:none;">{{ label }}</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
