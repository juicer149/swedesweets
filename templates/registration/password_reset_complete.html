{% extends "registration/auth_base.html" %}
{% load i18n %}

{% block title %}{% trans "Password reset complete" %} | SwedeSweets{% endblock %}

{% block content %}
<section class="screen" aria-labelledby="password-reset-complete-title">
  <div class="page page--auth">
    <header class="page__header">
      <h1 id="password-reset-complete-title" class="page__title">
        {% trans "Password reset complete" %}
      </h1>
    </header>

    <div class="form-actions page__actions">
      <a
        class="button button--md button--solid button--tone-place page__submit"
        href="{% url 'login' %}"
      >
        {% trans "Log in" %}
      </a>
    </div>
  </div>
</section>
{% endblock %}
