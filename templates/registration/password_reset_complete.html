{% extends "registration/auth_base.html" %}
{% load i18n %}

{% block title %}{% trans "Password reset complete" %} | SwedeSweets{% endblock %}

{% block content %}
<section class="auth-page auth-page--bare" aria-labelledby="password-reset-complete-title">
  <div class="auth-card auth-card--bare">
    <header class="auth-card__header">
      <h1 id="password-reset-complete-title" class="auth-card__title">
        {% trans "Password reset complete" %}
      </h1>
    </header>

    <div class="form-actions auth-card__actions">
      <a
        class="button button--md button--solid button--tone-place auth-card__submit"
        href="{% url 'login' %}"
      >
        {% trans "Log in" %}
      </a>
    </div>
  </div>
</section>
{% endblock %}
